name: CI

env:
  DOCKERHUB_USERNAME: shashank2002
  IMAGE_NAME: nest-blog-app
  GITOPS_REPO_ORG: Shashank0271
  GITOPS_REPO_NAME: deploy-projects
  GITOPS_DEPLOYMENT_FILE_PATH: nest-blog-app/deployment.yaml

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  docker-build-push:
    runs-on: ubuntu-latest
    needs: lint-and-bulid
    outputs:
      image: ${{ steps.build-and-push.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build-and-push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --tag "${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" --push .
          echo "image=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Verify step output
        run: |
          echo "Step output: '${{ steps.build-and-push.outputs.image }}'"

  update-gitops:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/head/master'

    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO_ORG }}/${{ env.GITOPS_REPO_NAME }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image
        working-directory: gitops
        run: |
          sed -i "s|image: .*|image: ${{ needs.docker-build-push.outputs.image }}|" "${{ env.GITOPS_DEPLOYMENT_FILE_PATH }}"

      - name: Commit changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.GITOPS_DEPLOYMENT_FILE_PATH }}"
          git commit -m "Update image to ${{ needs.docker-build-push.outputs.image }}" || echo "No changes to commit"
          git push
