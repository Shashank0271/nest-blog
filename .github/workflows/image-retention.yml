name: Container Retention Policy

on:
  workflow_dispatch:
  push:
  pull_request:
  # schedule:
  #   - cron: '5 * * * *' # every hour

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old test images
    steps:
      - uses: user/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.DOCKERHUB_TOKEN }}
          image-names: 'nest-blog-app'
          # image-tags: 'test* dev*' # target any image that has a tag starting with the word test or dev
          cut-off: 1h

          dry-run: true
