name: Container Retention Policy

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old container images

    steps:
      - name: Delete old container images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: nest-blog-app
          cut-off: 1h
          dry-run: true
